<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="icon.ico">
    <title>Tabela de Notas</title>

    <style>
        body {
            margin-left: 3%;
            margin-top: 2%;
        }

        .titulo {
            font-family: "Century Gothic", sans-serif;
        }

        .tabela {
            margin: 3%;
        }

        .foto {
            width: 45px;
            height: 45px;
        }
    </style>
</head>

<body>
    <div class="titulo">
        <h1>Exercício - Desenvolvimento Web</h1>
    </div>

    <div class="tabela">
        <!-- Dados fictícios usados apenas para demonstrar tabelas em HTML -->
        <table border="1" cellspacing="2">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>RA</th>
                    <th>Nota P1</th>
                    <th>Nota P2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img class="foto" src="spider.ico" alt="Spider Man"></td>
                    <td>Spider Man</td>
                    <td>00.000.002-0</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td><img class="foto" src="captain.ico" alt="Captain America"></td>
                    <td>Captain America</td>
                    <td>00.000.003-0</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td><img class="foto" src="iron.ico" alt="Iron Man"></td>
                    <td>Iron Man</td>
                    <td>00.000.004-0</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td><img class="foto" src="wolverine.ico" alt="Wolverine"></td>
                    <td>Wolverine</td>
                    <td>00.000.005-0</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
